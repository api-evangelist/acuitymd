method: probed
source: >-
  live HTTP probes of the standard /.well-known/ paths on every AcuityMD host
  (www.acuitymd.com, app.acuitymd.com, help.acuitymd.com, api.acuitymd.com)
hosts:
- www.acuitymd.com
- app.acuitymd.com
- help.acuitymd.com
- api.acuitymd.com
notes: >-
  AcuityMD serves NO well-known discovery document of its own. Three separate
  false positives were ruled out on this pass and none of them is an AcuityMD
  document, so no WellKnown or SecurityTxt pointer is emitted in apis.yml:
  (1) www.acuitymd.com answers every /.well-known/* path with HTTP 404 and a
  Webflow "Invalid .well-known route" HTML page; (2) app.acuitymd.com is a
  single-page application whose catch-all returns HTTP 200 with the SPA HTML
  shell for EVERY /.well-known/* path probed, including agent-card.json and
  openapi.json — a 200 that carries no document; (3) help.acuitymd.com does
  return a real security.txt at HTTP 200, but it is INTERCOM's, not
  AcuityMD's — the help center is hosted by Intercom and the file declares
  "Canonical: https://app.intercom.com/.well-known/security.txt" with
  Contact: security@intercom.com and bugcrowd.com/intercom. Crediting it to
  AcuityMD would attribute another company's disclosure program to this
  provider. api.acuitymd.com resolves through Cloudflare to an Envoy proxy
  that answers every anonymous path with 404 "fault filter abort".
