aid: acuitymd
name: AcuityMD
description: >-
  AcuityMD is a MedTech commercial intelligence platform that combines precise
  medical device market data, AI-powered insights (AcuityAI), and workflow
  tools to help commercial teams accelerate product adoption and revenue
  growth. Used by 500+ medical device companies, the platform spans Market
  Intelligence, Care Journeys, Targeting, Pipeline, Contracts, Territories and
  Forecasting. AcuityMD is a closed enterprise SaaS product: it exposes no
  public developer API, but integrates via a Salesforce AppExchange app, a
  Snowflake Marketplace listing, and an enterprise Data Connector that delivers
  market intelligence into customer data warehouses. Backed by ICONIQ Capital
  and Redpoint Ventures.
